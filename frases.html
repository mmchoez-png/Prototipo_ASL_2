<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL - Phrases Module</title>
  <link rel="stylesheet" href="style.css">
  <!-- MediaPipe Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <main class="main-container">
    <header class="header">
      <a href="index.html" class="back-link">← Back to Home</a>
      <h1>💬 Phrases Module</h1>
      <p>Dynamic sign phrase detection in real-time</p>
    </header>

    <div class="video-wrapper">
      <button class="btn-action btn-cam" onclick="toggleCamera()">🔄 Switch Camera</button>
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="status-box">
      <div id="output-class" class="detected-class">Ready for signs 👋</div>
      <div id="output-confidence" class="confidence-tag">Confidence: --</div>
    </div>

    <!-- Listener Section -->
    <section class="section-container">
      <h3>Listener Section (Speech-to-Text)</h3>
      <div id="speech-output" class="sentence-box">Press "Speak (Listener)" to listen...</div>
      <div class="button-group">
        <button id="mic-btn" class="btn-action btn-mic" onclick="toggleMic()">
          🎙️ <span id="mic-text">Speak (Listener)</span>
        </button>
        <button class="btn-action" onclick="limpiarVozOyente()">Clear Speech</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => initModulo('frases'));
  </script>
</body>
</html>
